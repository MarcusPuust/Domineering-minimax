<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domineering Minimax</title>
    <meta
      name="description"
      content="Domineering Minimax is a simple 4 by 4 board game project built with HTML, CSS, and JavaScript."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">Game project</p>
        <h1 class="page-title">Domineering Minimax</h1>
        <p class="description">
          Domineering is a two-player strategy game played on a 4 by 4 board.
          One player places vertical dominoes and the other places horizontal
          dominoes. The goal is to make the last move while blocking the other
          player.
        </p>
      </header>

      <section class="game-area" aria-label="Domineering game board">
        <p class="game-status" id="game-status">
          Player 0&rsquo;s turn: place a vertical piece.
        </p>
        <p class="game-message" id="game-message" aria-live="polite"></p>
        <label class="search-mode-label" for="search-mode">
          Computer search:
          <select id="search-mode">
            <option value="minimax">Minimax</option>
            <option value="alpha-beta">Minimax with alpha-beta pruning</option>
          </select>
        </label>
        <div class="game-board-container">
          <div
            class="game-board"
            id="game-board"
            aria-label="4 by 4 Domineering board"
          ></div>
          <div class="winner-overlay" id="winner-overlay" hidden>
            <div class="winner-card" role="dialog" aria-modal="true">
              <h2 class="winner-title" id="winner-title"></h2>
              <button class="play-again-button" id="play-again-button" type="button">
                Play Again
              </button>
            </div>
          </div>
        </div>
        <button class="new-game-button" id="new-game-button" type="button">
          New Game
        </button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
