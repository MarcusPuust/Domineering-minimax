<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Domineering Minimax</title>
    <meta
      name="description"
      content="Domineering Minimax is a simple 4 by 4 board game project built with HTML, CSS, and JavaScript."
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">Game project</p>
        <h1 class="page-title">Domineering Minimax</h1>
        <p class="description">
          Domineering is a two-player strategy game played on a 4 by 4 board.
          One player places vertical dominoes and the other places horizontal
          dominoes. The goal is to make the last move while blocking the other
          player.
        </p>
      </header>

      <section class="game-area" aria-label="Domineering game board">
        <p class="game-status" id="game-status">
          Player 0&rsquo;s turn: place a vertical piece.
        </p>
        <div
          class="game-board"
          id="game-board"
          aria-label="4 by 4 Domineering board"
        ></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
